<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Events — LEAP</title>
  <script>
    (() => {
      const next = new URL("recognitions.html", window.location.href);
      const current = new URLSearchParams(window.location.search);
      for (const [key, value] of current.entries()) next.searchParams.set(key, value);
      next.searchParams.set("category", "event");
      window.location.replace(next.href);
    })();
  </script>
</head>
<body>
  <p><a href="recognitions.html?category=event">Open Events →</a></p>
</body>
</html>
