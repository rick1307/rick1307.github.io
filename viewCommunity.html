<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Community | Wild Ledger</title>
<style>
  :root {
    --ink: #f5fbfa;
    --deep: #071f2c;
    --lagoon: #29b8b1;
    --sea-glass: #79d5c2;
    --mango: #f4bd58;
    --coral: #ef765d;
    --panel: rgba(10, 45, 58, .70);
    --line: rgba(219, 248, 244, .14);
    --shadow: 0 28px 78px rgba(0, 16, 24, .38);
  }

  * { box-sizing: border-box; }
  html { min-height: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    color: var(--ink);
    background:
      radial-gradient(circle at 12% 14%, rgba(41, 184, 177, .34) 0, rgba(41, 184, 177, .12) 22%, transparent 44%),
      radial-gradient(circle at 87% 15%, rgba(244, 189, 88, .24) 0, rgba(244, 189, 88, .07) 21%, transparent 42%),
      radial-gradient(circle at 88% 86%, rgba(239, 118, 93, .24) 0, rgba(239, 118, 93, .07) 23%, transparent 46%),
      radial-gradient(circle at 20% 88%, rgba(121, 213, 194, .19) 0, transparent 42%),
      linear-gradient(145deg, #06202e 0%, #0a3444 48%, #071d2a 100%);
    overflow-x: hidden;
  }

  body::before,
  body::after {
    content: "";
    position: fixed;
    pointer-events: none;
    z-index: 0;
  }

  body::before {
    inset: 0;
    opacity: .28;
    background-image:
      linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
    background-size: 52px 52px;
    mask-image: linear-gradient(to bottom, rgba(0,0,0,.55), transparent 78%);
    -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,.55), transparent 78%);
  }

  body::after {
    width: 420px;
    height: 420px;
    right: -180px;
    top: 35%;
    border-radius: 50%;
    border: 1px solid rgba(121, 213, 194, .13);
    box-shadow:
      0 0 0 54px rgba(121, 213, 194, .035),
      0 0 0 108px rgba(121, 213, 194, .025),
      0 0 0 162px rgba(121, 213, 194, .015);
  }

  .shell {
    position: relative;
    z-index: 1;
    width: min(100%, 980px);
    margin: 0 auto;
    padding: 46px 22px 56px;
  }

  .console {
    position: relative;
    overflow: hidden;
    border: 1px solid var(--line);
    border-radius: 32px;
    background:
      linear-gradient(160deg, rgba(255,255,255,.075), rgba(255,255,255,.018)),
      var(--panel);
    box-shadow: var(--shadow);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
  }

  .console::before {
    content: "";
    position: absolute;
    inset: 0 0 auto;
    height: 4px;
    background: linear-gradient(90deg, var(--lagoon), var(--sea-glass), var(--mango), var(--coral));
  }

  .console-header {
    position: relative;
    padding: 34px;
  }

  .top-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 34px;
  }

  .top-actions,
  .top-navigation {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .top-navigation {
    margin-left: auto;
    justify-content: flex-end;
    flex-wrap: wrap;
  }

  .owner-back,
  .operations-manual-link,
  .edit-community {
    color: #b7f0df;
    border-color: rgba(121, 213, 194, .30);
    background: rgba(121, 213, 194, .09);
  }

  .owner-back:hover,
  .owner-back:focus-visible,
  .operations-manual-link:hover,
  .operations-manual-link:focus-visible,
  .edit-community:hover,
  .edit-community:focus-visible {
    color: #e5fff8;
    border-color: rgba(121, 213, 194, .54);
    background: rgba(121, 213, 194, .15);
  }

  .edit-community {
    width: 54px;
    height: 54px;
    min-width: 54px;
    min-height: 54px;
    padding: 0;
    border-radius: 50%;
    line-height: 1;
  }

  .edit-community svg {
    width: 26px;
    height: 26px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .operator-logout {
    color: #ffd2ca;
    border-color: rgba(239, 118, 93, .38);
    background: rgba(239, 118, 93, .09);
    cursor: pointer;
  }

  .operator-logout:hover,
  .operator-logout:focus-visible {
    color: #fff0ec;
    border-color: rgba(239, 118, 93, .62);
    background: rgba(239, 118, 93, .16);
  }

  h1 {
    margin: 0;
    max-width: 760px;
    font-size: clamp(2.25rem, 7vw, 4.75rem);
    line-height: .96;
    letter-spacing: -.055em;
    font-weight: 900;
  }

  .community-links {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 28px;
  }

  .community-link {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 46px;
    padding: 0 18px;
    border: 1px solid rgba(121, 213, 194, .34);
    border-radius: 999px;
    color: #e5fff8;
    background: rgba(121, 213, 194, .10);
    text-decoration: none;
    font-weight: 800;
    letter-spacing: .01em;
  }

  .community-link:hover,
  .community-link:focus-visible {
    border-color: rgba(121, 213, 194, .58);
    background: rgba(121, 213, 194, .16);
  }

  @media (max-width: 700px) {
    .shell { padding: 22px 14px 36px; }
    .console { border-radius: 24px; }
    .console-header { padding: 26px 20px 28px; }
    .top-nav { gap: 10px; margin-bottom: 28px; }
  }
</style>
<link rel="stylesheet" href="wildLedgerControls.css">
  <link rel="stylesheet" href="wildLedgerBackend.css">
</head>
<body>
  <main class="shell">
    <section class="console" aria-labelledby="view-community-title">
      <header class="console-header">
        <nav class="top-nav" aria-label="Community controls and navigation">
          <div class="top-actions">
            <a class="owner-back wl-header-control" id="ownerCommunitiesBack" href="communities.html">← Communities</a>
            <button class="operator-logout wl-header-control" id="operatorLogout" type="button">Log Out</button>
          </div>
          <div class="top-navigation">
            <a class="edit-community wl-header-control" id="communityEditLink" href="setup.html?mode=edit" aria-label="Edit community" title="Edit community"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"></path><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg></a>
          </div>
        </nav>
        <h1 id="view-community-title">Community</h1>
        <div class="community-links">
          <a class="community-link" id="communityTokenomicsLink" href="viewCommunityTokenomics.html">Tokenomics</a>
          <a class="community-link" id="communityRecognitionLink" href="viewCommunityRecognition.html">Recognition</a>
          <a class="community-link" id="communityCheckbookLink" href="operatorCheckbook.html">Checkbook</a>
          <a class="community-link" id="communityLibraryLink" href="viewCommunityLibrary.html">Library</a>
        </div>
      </header>
    </section>
  </main>

<script src="js/communityConfig.js" data-registry-only="true"></script>
<script>
(() => {
  const params = new URLSearchParams(window.location.search);
  const registry = window.WILD_LEDGER_COMMUNITY_REGISTRY || {};
  const defaultCommunity = Object.values(registry)[0] || null;
  const defaultBackendId = window.WILD_LEDGER_BACKEND_COMMUNITY_ID?.(defaultCommunity) || "";

  function readOperatorSession() {
    try {
      const session = JSON.parse(sessionStorage.getItem("wildLedgerOperatorSession") || "null");
      if (!session || typeof session !== "object") return null;
      if (String(session.role || "").trim().toLowerCase() !== "operator") return null;

      const version = Number(session.version);
      const communityId = String(session.communityId || "").trim().toUpperCase();
      const source = String(session.source || "").trim();
      const wallet = String(
        version === 2 ? session.connectedWallet : session.verifiedWallet
      ).trim();

      if (!communityId || !/^r[1-9A-HJ-NP-Za-km-z]{24,34}$/.test(wallet)) return null;

      const legacyProofSession = version === 1 && source === "wallet-proof + validated-xrpl-authority";
      const walletConnectSession = version === 2 && source === "wallet-connect + validated-xrpl-authority";
      if (!legacyProofSession && !walletConnectSession) return null;

      return { ...session, communityId, operatorWallet: wallet, role: "operator" };
    } catch (_) {
      return null;
    }
  }

  function clearOperatorSession() {
    sessionStorage.removeItem("wildLedgerRole");
    sessionStorage.removeItem("wildLedgerCommunity");
    sessionStorage.removeItem("wildLedgerOperatorWallet");
    sessionStorage.removeItem("wildLedgerOperatorSession");
    sessionStorage.removeItem("wildLedger.activeWallet");
    sessionStorage.removeItem("wildLedger.currentCommunityConfig");
    sessionStorage.removeItem("wildLedger.currentPublishedConfig");
  }

  const operatorSession = readOperatorSession();
  const urlRole = String(params.get("role") || "").trim().toLowerCase();
  const storedRole = String(sessionStorage.getItem("wildLedgerRole") || "").trim().toLowerCase();
  const operatorRequested = urlRole === "operator" || urlRole === "manager" || storedRole === "operator";

  // Operator access is session-led. A typed role/community URL never creates Operator context.
  if (operatorRequested && !operatorSession) {
    clearOperatorSession();
    window.location.replace("getWild.html?operatorSession=required");
    return;
  }

  const role = operatorSession ? "operator" : "owner";
  const requestedCommunity = operatorSession
    ? operatorSession.communityId
    : (params.get("community") || sessionStorage.getItem("wildLedgerCommunity") || defaultBackendId);
  const community = window.WILD_LEDGER_GET_COMMUNITY?.(requestedCommunity) || null;
  const requestedId = operatorSession
    ? operatorSession.communityId
    : (window.WILD_LEDGER_BACKEND_COMMUNITY_ID?.(community) || String(requestedCommunity || "").trim().toUpperCase());

  if (operatorSession) {
    // Synchronize old downstream keys, but the wallet-connected Operator session remains authoritative here.
    sessionStorage.setItem("wildLedgerRole", "operator");
    sessionStorage.setItem("wildLedgerCommunity", operatorSession.communityId);
    sessionStorage.setItem("wildLedgerOperatorWallet", operatorSession.operatorWallet);
  }

  const viewCommunityTitle = document.getElementById("view-community-title");
  const ownerCommunitiesBack = document.getElementById("ownerCommunitiesBack");
  const operatorLogout = document.getElementById("operatorLogout");
  const communityTokenomicsLink = document.getElementById("communityTokenomicsLink");
  const communityRecognitionLink = document.getElementById("communityRecognitionLink");
  const communityCheckbookLink = document.getElementById("communityCheckbookLink");
  const communityLibraryLink = document.getElementById("communityLibraryLink");
  const communityEditLink = document.getElementById("communityEditLink");

  if (ownerCommunitiesBack && role !== "owner") {
    ownerCommunitiesBack.remove();
  }

  if (operatorLogout && role !== "operator") {
    operatorLogout.remove();
  } else if (operatorLogout) {
    operatorLogout.addEventListener("click", () => {
      clearOperatorSession();
      window.location.href = "getWild.html";
    });
  }

  if (communityTokenomicsLink) {
    communityTokenomicsLink.href = `viewCommunityTokenomics.html?community=${encodeURIComponent(requestedId)}&role=${encodeURIComponent(role)}`;
  }

  if (communityRecognitionLink) {
    communityRecognitionLink.href = `viewCommunityRecognition.html?community=${encodeURIComponent(requestedId)}&role=${encodeURIComponent(role)}`;
  }

  if (communityCheckbookLink) {
    communityCheckbookLink.href = `operatorCheckbook.html?community=${encodeURIComponent(requestedId)}&role=${encodeURIComponent(role)}`;
  }

  if (communityLibraryLink) {
    communityLibraryLink.href = `viewCommunityLibrary.html?community=${encodeURIComponent(requestedId)}&role=${encodeURIComponent(role)}&from=viewCommunity`;
  }

  if (communityEditLink) {
    communityEditLink.href = `setup.html?mode=edit&community=${encodeURIComponent(requestedId)}&role=${encodeURIComponent(role)}`;
  }

  let cachedCommunityName = "";
  try {
    const cached = JSON.parse(sessionStorage.getItem("wildLedger.currentCommunityConfig") || "null");
    if (cached && String(cached.communityId || "").trim().toUpperCase() === String(requestedId || "").trim().toUpperCase()) {
      cachedCommunityName = String(cached?.config?.communityName || "").trim();
    }
  } catch (_) {}

  const displayName = cachedCommunityName || operatorSession?.communityName || community?.communityName || requestedId || "Community";
  viewCommunityTitle.textContent = displayName;
  document.title = `${displayName} | Wild Ledger`;
})();
</script>
</body>
</html>
