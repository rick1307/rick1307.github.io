<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wild Ledger</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#080b0a}
body{
  min-height:100svh;
  display:grid;
  place-items:center;
  overflow:hidden;
  color:#f7f1df;
  font-family:Impact,Haettenschweiler,"Arial Narrow Bold",system-ui,sans-serif;
}
body:before{
  content:"";
  position:fixed;inset:-30%;
  background:
    radial-gradient(circle at 20% 25%,rgba(255,92,0,.42),transparent 22%),
    radial-gradient(circle at 78% 72%,rgba(0,255,177,.22),transparent 24%),
    repeating-conic-gradient(from 17deg at 50% 50%,rgba(255,255,255,.035) 0 4deg,transparent 4deg 13deg);
  animation:drift 18s linear infinite;
}
body:after{
  content:"";
  position:fixed;inset:0;pointer-events:none;
  background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 1px,transparent 1px 4px);
  mix-blend-mode:screen;
}
@keyframes drift{to{transform:rotate(360deg)}}
.stage{
  position:relative;
  z-index:1;
  width:min(980px,92vw);
  text-align:center;
  padding:44px 0;
}
.eyebrow{
  display:inline-block;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:12px;
  font-weight:900;
  letter-spacing:.28em;
  text-transform:uppercase;
  color:#7fffd4;
  transform:rotate(-2deg);
  margin-bottom:12px;
}
h1{
  margin:0;
  font-size:clamp(72px,16vw,178px);
  line-height:.78;
  letter-spacing:-.065em;
  text-transform:uppercase;
  text-shadow:5px 6px 0 #b52d00,10px 12px 0 rgba(0,0,0,.35);
  transform:rotate(-1.5deg);
}
.tag{
  margin:28px auto 38px;
  max-width:680px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:clamp(13px,2vw,17px);
  font-weight:800;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:#d9d0ba;
}
.doors{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
  max-width:820px;
  margin:auto;
}
.door{
  position:relative;
  min-height:190px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  padding:26px;
  color:#0a0c0b;
  text-decoration:none;
  border:4px solid #0a0c0b;
  border-radius:4px 26px 5px 22px;
  box-shadow:9px 10px 0 #000;
  transition:transform .16s ease,box-shadow .16s ease;
  overflow:hidden;
}
.door:before{
  content:"";
  position:absolute;inset:-50%;
  background:repeating-linear-gradient(120deg,transparent 0 17px,rgba(255,255,255,.14) 17px 20px);
  transform:rotate(8deg);
}
.door:hover,.door:focus-visible{
  transform:translate(-3px,-4px) rotate(-1deg);
  box-shadow:14px 15px 0 #000;
}
.door span{position:relative;z-index:1}
.door .small{
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:11px;
  font-weight:900;
  letter-spacing:.18em;
  text-transform:uppercase;
  margin-bottom:10px;
}
.door .name{
  font-size:clamp(30px,5vw,55px);
  line-height:.92;
  text-transform:uppercase;
  letter-spacing:-.035em;
}
.frog{background:#7fffd4;transform:rotate(1deg)}
.zach{background:#ff6a00;transform:rotate(-1.5deg)}
.footer{
  margin-top:36px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:10px;
  font-weight:800;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:#827d70;
}
@media(max-width:650px){
  .stage{width:min(90vw,500px)}
  h1{font-size:clamp(68px,23vw,120px)}
  .doors{grid-template-columns:1fr;gap:18px}
  .door{min-height:150px}
  .tag{margin:24px auto 30px}
}
@media(prefers-reduced-motion:reduce){
  body:before{animation:none}
  .door{transition:none}
}
</style>
</head>
<body>
<main class="stage">
  <div class="eyebrow">One LEAP · Many Communities</div>
  <h1>Wild<br>Ledger</h1>
  <div class="tag">Pick your community. Step through the door.</div>

  <div class="doors">
    <a class="door frog" href="index.html">
      <span class="small">Come aboard</span>
      <span class="name">Sailing Frog's Leap</span>
    </a>

    <a class="door zach" href="zachsHotRods.html">
      <span class="small">Fire it up</span>
      <span class="name">Zach's Hot Rods</span>
    </a>
  </div>

  <div class="footer">Wild Ledger · Powered by LEAP</div>
</main>
</body>
</html>
