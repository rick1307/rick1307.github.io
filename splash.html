<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wild Ledger</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#080b0a}
body{
  min-height:100svh;
  display:grid;
  place-items:center;
  overflow-x:hidden;
  overflow-y:auto;
  color:#f7f1df;
  font-family:Impact,Haettenschweiler,"Arial Narrow Bold",system-ui,sans-serif;
}
body:before{
  content:"";
  position:fixed;inset:-30%;
  background:
    radial-gradient(circle at 20% 25%,rgba(255,92,0,.42),transparent 22%),
    radial-gradient(circle at 78% 72%,rgba(0,255,177,.22),transparent 24%),
    repeating-conic-gradient(from 17deg at 50% 50%,rgba(255,255,255,.035) 0 4deg,transparent 4deg 13deg);
  animation:drift 18s linear infinite;
}
body:after{
  content:"";
  position:fixed;inset:0;pointer-events:none;
  background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 1px,transparent 1px 4px);
  mix-blend-mode:screen;
}
@keyframes drift{to{transform:rotate(360deg)}}
.stage{
  position:relative;
  z-index:1;
  width:min(980px,92vw);
  text-align:center;
  padding:44px 0;
}
.eyebrow{
  display:inline-block;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:12px;
  font-weight:900;
  letter-spacing:.28em;
  text-transform:uppercase;
  color:#7fffd4;
  transform:rotate(-2deg);
  margin-bottom:12px;
}
h1{
  margin:0;
  font-size:clamp(72px,16vw,178px);
  line-height:.78;
  letter-spacing:-.065em;
  text-transform:uppercase;
  text-shadow:5px 6px 0 #b52d00,10px 12px 0 rgba(0,0,0,.35);
  transform:rotate(-1.5deg);
}
.tag{
  margin:28px auto 38px;
  max-width:680px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:clamp(13px,2vw,17px);
  font-weight:800;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:#d9d0ba;
}
.doors{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
  max-width:820px;
  margin:auto;
}
.door{
  position:relative;
  min-height:190px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  padding:26px;
  color:#0a0c0b;
  text-decoration:none;
  border:4px solid #0a0c0b;
  border-radius:4px 26px 5px 22px;
  box-shadow:9px 10px 0 #000;
  transition:transform .16s ease,box-shadow .16s ease;
  overflow:hidden;
}
.door:before{
  content:"";
  position:absolute;inset:-50%;
  background:repeating-linear-gradient(120deg,transparent 0 17px,rgba(255,255,255,.14) 17px 20px);
  transform:rotate(8deg);
}
.door:hover,.door:focus-visible{
  transform:translate(-3px,-4px) rotate(-1deg);
  box-shadow:14px 15px 0 #000;
}
.door span{position:relative;z-index:1}
.door .small{
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:11px;
  font-weight:900;
  letter-spacing:.18em;
  text-transform:uppercase;
  margin-bottom:10px;
}
.door .name{
  font-size:clamp(30px,5vw,55px);
  line-height:.92;
  text-transform:uppercase;
  letter-spacing:-.035em;
}
.frog{background:#7fffd4;transform:rotate(1deg)}
.zach{background:#ff6a00;transform:rotate(-1.5deg)}
.live-community{background:#f7f1df;transform:rotate(.4deg)}
.door.pending{cursor:default;background:#d9d0ba;color:#0a0c0b;opacity:.78}
.door.pending:hover,.door.pending:focus-visible{transform:rotate(.4deg);box-shadow:9px 10px 0 #000}
.live-state{
  margin:28px auto 0;
  max-width:820px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:10px;
  font-weight:800;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:#827d70;
}
.live-state.error{color:#ff8a66}

.start-link{
  display:inline-block;
  margin:18px auto 0;
  color:#69aefc;
  text-decoration:underline;
  text-underline-offset:3px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:11px;
  font-weight:800;
  letter-spacing:.06em;
}
.start-link:hover,.start-link:focus-visible{
  color:#9bc9ff;
}

.faq-link{
  display:inline-block;
  margin-top:34px;
  padding:12px 18px;
  color:#f7f1df;
  text-decoration:none;
  border:2px solid #f7f1df;
  border-radius:4px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:11px;
  font-weight:900;
  letter-spacing:.18em;
  text-transform:uppercase;
  transition:transform .16s ease,background .16s ease,color .16s ease;
}
.faq-link:hover,.faq-link:focus-visible{
  transform:translateY(-2px);
  background:#f7f1df;
  color:#0a0c0b;
}
.footer{
  margin-top:24px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:10px;
  font-weight:800;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:#827d70;
}
@media(max-width:650px){
  .stage{width:min(90vw,500px)}
  h1{font-size:clamp(68px,23vw,120px)}
  .doors{grid-template-columns:1fr;gap:18px}
  .door{min-height:150px}
  .tag{margin:24px auto 30px}
}
@media(prefers-reduced-motion:reduce){
  body:before{animation:none}
  .door{transition:none}
}
</style>
</head>
<body>
<main class="stage">
  <div class="eyebrow">One LEAP · Many Communities</div>
  <h1>Wild<br>Ledger</h1>
  <div class="tag">Pick your community. Join the action.</div>

  <div class="doors" id="communityDoors" aria-live="polite"></div>
  <div class="live-state" id="communityLiveState">Reading validated XRPL community history…</div>

  <a class="faq-link" href="leapFaq.html">LEAP FAQ</a>

  <div class="footer">Powered by LEAP on the XRP Ledger</div>

  <a class="start-link" href="startCommunity.html">Start a Community</a>
</main>
<script src="js/wildLedgerConfig.js"></script>
<script src="js/communityConfig.js" data-registry-only="true"></script>
<script type="module">
import { readCommunityVisibility, communityIsHidden } from "./js/communityVisibility.js?wl=20261004xrpl1";

const doors = document.getElementById("communityDoors");
const liveState = document.getElementById("communityLiveState");
const config = window.WILD_LEDGER_CONFIG || {};
const SERVER = String(config.xrplWebSocket || "wss://s1.ripple.com/").trim();

function cardTone(community) {
  if (community.communityId === "SFL") return "frog";
  if (community.communityId === "ZHR") return "zach";
  return "live-community";
}

function cardEyebrow(community) {
  if (!community.publicReady) return "Setup pending";
  if (community.communityId === "SFL") return "Come aboard";
  if (community.communityId === "ZHR") return "Fire it up";
  return community.directoryStatus || "Community";
}

function communityDoor(community) {
  const ready = Boolean(community.publicReady);
  const card = document.createElement(ready ? "a" : "div");
  card.className = `door ${cardTone(community)}${ready ? "" : " pending"}`;

  if (ready) {
    const configId = String(community.config?.id || community.communityId || "").trim();
    card.href = `index.html?community=${encodeURIComponent(configId)}`;
  } else {
    card.setAttribute("aria-label", `${community.communityName || community.communityId} — setup pending`);
  }

  const small = document.createElement("span");
  small.className = "small";
  small.textContent = cardEyebrow(community);

  const name = document.createElement("span");
  name.className = "name";
  name.textContent = community.communityName || community.communityId;

  card.append(small, name);
  return card;
}

function render(communities) {
  doors.replaceChildren();
  communities.forEach(community => doors.appendChild(communityDoor(community)));
}

function publicCommunities(communities, visibilityState) {
  return communities.filter(community => !communityIsHidden(visibilityState, community.communityId));
}

try {
  const { discoverWildLedgerCommunities } = await import("./js/communityDiscovery.js?wl=20261004b");
  let latestCommunities = [];
  let visibilityState = null;

  const visibilityPromise = readCommunityVisibility({ serverUrl: SERVER, force: true })
    .then(result => {
      visibilityState = result;
      if (latestCommunities.length) render(publicCommunities(latestCommunities, visibilityState));
      return result;
    });

  const result = await discoverWildLedgerCommunities({
    force: true,
    onUpdate(update) {
      latestCommunities = update.communities;
      if (visibilityState) render(publicCommunities(latestCommunities, visibilityState));
      if (update.stage === "owner") {
        liveState.textContent = "Live Owner XRPL communities loaded · checking Owner-signed visibility…";
      }
    }
  });

  latestCommunities = result.communities;
  try {
    visibilityState = await visibilityPromise;
  } catch (visibilityError) {
    doors.replaceChildren();
    liveState.classList.add("error");
    liveState.textContent = "Community directory temporarily unavailable while XRPL visibility history is being read.";
    console.error("Wild Ledger visibility read failed", visibilityError);
    throw new Error("VISIBILITY_UNAVAILABLE");
  }

  const shown = publicCommunities(result.communities, visibilityState);
  render(shown);
  liveState.textContent = shown.length
    ? `Live from validated XRPL history · ${shown.length} ${shown.length === 1 ? "community" : "communities"}`
    : "No communities are currently shown.";

  if (result.warnings?.length) {
    liveState.textContent += ` · ${result.warnings.join(" ")}`;
  }
} catch (error) {
  if (error?.message !== "VISIBILITY_UNAVAILABLE") {
    doors.replaceChildren();
    liveState.classList.add("error");
    liveState.textContent = `Community list temporarily unavailable: ${error?.message || String(error)}`;
  }
}
</script>
</body>
</html>
