<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Community Recognition | Wild Ledger</title>
  <style>
    :root {
      --ink: #10243a;
      --muted: #66788b;
      --line: #dbe4ec;
      --soft: #f4f7fa;
      --panel: #ffffff;
      --blue: #0b5fa5;
      --green: #20734d;
      --amber: #b46a13;
      --red: #a13a3a;
      --dark: #0f1824;
      --dark-line: #29425a;
      --dark-text: #e7edf5;
      --dark-muted: #8ea5ba;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--soft);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
    }

    .wrap {
      width: min(94%, 980px);
      margin: 34px auto 70px;
    }

    .top {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      gap: 16px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: clamp(26px, 5vw, 38px);
    }

    .back {
      flex: 0 0 auto;
      text-decoration: none;
      color: var(--blue);
      font-weight: 700;
    }

    .crew-total {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      margin-bottom: 10px;
      padding: 0;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      text-align: center;
    }

    .crew-metric {
      display: grid;
      place-items: center;
      align-content: center;
      gap: 4px;
      min-width: 0;
      padding: 20px 16px;
    }

    .crew-metric + .crew-metric {
      border-left: 1px solid var(--line);
    }

    .crew-total strong {
      font-size: clamp(38px, 8vw, 58px);
      line-height: 1;
      color: var(--ink);
    }

    .crew-total span {
      color: var(--muted);
      font-size: 14px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .crew-total small {
      max-width: 240px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }

    .summary.checkbook-summary {
      grid-template-columns: repeat(4, 1fr);
    }

    .summary[hidden] { display: none; }

    .summary-card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 13px;
      text-align: center;
    }

    .summary-card strong {
      display: block;
      font-size: 25px;
      margin-bottom: 3px;
    }

    .summary-card span {
      color: var(--muted);
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: .06em;
      font-weight: 700;
    }

    .summary-card small {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.35;
    }

    .view-toggle {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin: 0 0 14px;
      width: 100%;
    }

    .view-toggle button {
      width: 100%;
      min-width: 0;
      border: 1px solid #c9d6e1;
      border-radius: 999px;
      background: #fff;
      color: var(--muted);
      padding: 10px 8px;
      font-weight: 700;
      text-align: center;
      white-space: nowrap;
      cursor: pointer;
    }

    .view-toggle button[aria-pressed="true"] {
      background: var(--blue);
      border-color: var(--blue);
      color: #fff;
    }

    .ledger {
      background: var(--dark);
      color: var(--dark-text);
      border: 1px solid var(--dark-line);
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(16,36,58,.12);
    }

    .history-view[hidden] { display: none; }

    .group { margin-bottom: 34px; }
    .group:last-child { margin-bottom: 0; }

    .group-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      padding-bottom: 8px;
      border-bottom: 1px solid #24384b;
      margin-bottom: 8px;
    }

    .group-head h2 {
      margin: 0;
      font-size: 14px;
      color: var(--dark-muted);
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .group-count {
      color: var(--dark-muted);
      font-size: 12px;
    }

    .item {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255,255,255,.055);
    }

    .item:last-child { border-bottom: 0; }

    .name {
      overflow-wrap: anywhere;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: clamp(18px, 3.5vw, 27px);
      line-height: 1.25;
    }

    .meta {
      text-align: right;
      white-space: nowrap;
      color: var(--dark-muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .history-status {
      display: inline-block;
      margin-top: 5px;
      padding: 3px 7px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .08em;
      text-transform: uppercase;
      border: 1px solid rgba(255,255,255,.18);
    }

    .history-status.canceled {
      color: #ffb7b7;
      border-color: rgba(255,183,183,.35);
      background: rgba(161,58,58,.18);
    }

    .history-status.cashed {
      color: #a9e6c1;
      border-color: rgba(169,230,193,.3);
      background: rgba(37,132,80,.16);
    }

    .item.canceled .name,
    .timeline-entry.canceled .timeline-fact strong {
      opacity: .62;
      text-decoration: line-through;
      text-decoration-thickness: 1px;
    }

    .timeline-entry {
      display: grid;
      grid-template-columns: 120px minmax(0, 1fr);
      gap: 16px;
      padding: 13px 0;
      border-bottom: 1px solid rgba(255,255,255,.055);
    }

    .timeline-entry:last-child { border-bottom: 0; }

    .timeline-date {
      color: var(--dark-muted);
      font-size: 12px;
      font-weight: 700;
      line-height: 1.45;
    }

    .timeline-facts { display: grid; gap: 7px; }

    .timeline-fact {
      display: grid;
      grid-template-columns: 88px minmax(0, 1fr);
      gap: 10px;
      align-items: baseline;
    }

    .timeline-fact span {
      color: var(--dark-muted);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .timeline-fact strong {
      overflow-wrap: anywhere;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: clamp(16px, 3vw, 21px);
      line-height: 1.25;
    }

    .empty {
      color: var(--dark-muted);
      font-style: italic;
      padding: 8px 0;
    }

    .checkbook-intro {
      margin: 0 0 16px;
      color: var(--dark-muted);
      font-size: 13px;
      line-height: 1.55;
    }

    .check-list {
      display: grid;
      gap: 12px;
    }

    .check-card {
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.11);
      border-radius: 16px;
      background: rgba(255,255,255,.045);
      padding: 16px 16px 14px 19px;
    }

    .check-card::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 5px;
      background: var(--green);
    }

    .check-card.soon::before { background: var(--amber); }
    .check-card.urgent::before,
    .check-card.expired::before { background: var(--red); }

    .check-card.expired {
      background: rgba(161,58,58,.09);
      border-color: rgba(161,58,58,.3);
    }

    .check-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }

    .check-amount {
      color: #fff;
      font-size: clamp(22px, 4vw, 29px);
      line-height: 1;
      font-weight: 800;
    }

    .check-reason {
      margin-top: 7px;
      color: #d8e5f2;
      font-size: 14px;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .check-status {
      flex: 0 0 auto;
      border: 1px solid rgba(32,115,77,.55);
      background: rgba(32,115,77,.2);
      color: #e8fff4;
      border-radius: 999px;
      padding: 6px 9px;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .check-card.soon .check-status {
      border-color: rgba(180,106,19,.6);
      background: rgba(180,106,19,.22);
      color: #fff0d4;
    }

    .check-card.urgent .check-status,
    .check-card.expired .check-status {
      border-color: rgba(161,58,58,.6);
      background: rgba(161,58,58,.22);
      color: #ffe3e3;
    }

    .check-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 9px 18px;
    }

    .check-fact span {
      display: block;
      color: var(--dark-muted);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
      margin-bottom: 3px;
    }

    .check-fact strong {
      display: block;
      color: var(--dark-text);
      font-size: 13px;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    .check-countdown {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid rgba(255,255,255,.08);
      color: #c9d8e5;
      font-size: 12px;
      line-height: 1.5;
    }

    .check-countdown b { color: #fff; }
    .check-card.expired .check-countdown b { color: #ffd2d2; }

    .check-id {
      margin-top: 8px;
      color: #687f94;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 10px;
      overflow-wrap: anywhere;
    }

    .footnote {
      color: var(--muted);
      margin-top: 14px;
      font-size: 13px;
      line-height: 1.5;
    }

    @media (max-width: 760px) {
      .summary.checkbook-summary { grid-template-columns: 1fr 1fr; }
    }

    @media (max-width: 680px) {
      .wrap { width: min(96%, 980px); margin-top: 20px; }
      .summary {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
        margin-bottom: 8px;
      }
      .summary-card {
        padding: 10px 4px;
      }
      .summary-card strong {
        font-size: 23px;
      }
      .summary-card span {
        font-size: 11px;
        letter-spacing: .04em;
      }
      .summary.checkbook-summary { grid-template-columns: 1fr 1fr; }
      .ledger { padding: 19px 16px; }
      .item { grid-template-columns: 1fr; }
      .meta { text-align: left; white-space: normal; }
      .timeline-entry { grid-template-columns: 1fr; gap: 7px; }
      .timeline-fact { grid-template-columns: 78px minmax(0, 1fr); }
      .view-toggle {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
      }
      .view-toggle button {
        width: 100%;
        padding: 10px 4px;
        font-size: 12px;
      }
      .check-grid { grid-template-columns: 1fr; }
    }
  


    /* Manager motif experiment: Aubergine + oxidized copper + warm parchment */
    :root {
      --ink: #2c1f2f;
      --muted: #7a6873;
      --line: #dbcfc7;
      --soft: #f4eee8;
      --panel: #fffaf5;
      --blue: #8f4f3b;
      --green: #4f7a67;
      --amber: #b87832;
      --red: #a74646;
      --dark: #211521;
      --dark-line: #5d3b4a;
      --dark-text: #f6ece4;
      --dark-muted: #c0a7ad;
    }

    body {
      background:
        radial-gradient(circle at 12% 0%, rgba(160,91,62,.16), transparent 34%),
        radial-gradient(circle at 88% 8%, rgba(83,112,96,.14), transparent 32%),
        linear-gradient(180deg, #f7f1eb 0%, #efe7df 58%, #e9dfd6 100%);
    }

    h1 {
      color: #3a2439;
      letter-spacing: -.025em;
    }

    .back {
      color: #8f4f3b;
    }

    .crew-total {
      background:
        linear-gradient(135deg, rgba(255,250,245,.98), rgba(246,235,225,.96));
      border-color: #d3bcae;
      box-shadow: 0 14px 34px rgba(74,45,50,.10);
    }

    .crew-metric:first-child {
      background: linear-gradient(135deg, rgba(121,72,87,.07), transparent 72%);
    }

    .crew-metric:last-child {
      background: linear-gradient(135deg, rgba(78,116,99,.08), transparent 72%);
    }

    .crew-metric + .crew-metric {
      border-left-color: #d3bcae;
    }

    .crew-total strong {
      color: #4a2d46;
      text-shadow: 0 1px 0 rgba(255,255,255,.8);
    }

    .crew-total span {
      color: #8f4f3b;
    }

    .crew-total small {
      color: #76636d;
    }

    .refresh {
      background: #fff8f2;
      border-color: #ccb3a5;
      color: #7f4435;
      box-shadow: 0 3px 10px rgba(72,42,45,.06);
    }

    .summary-card {
      background: rgba(255,250,245,.92);
      border-color: #d8c8bd;
      box-shadow: 0 8px 20px rgba(70,45,52,.055);
    }

    .summary-card strong {
      color: #4a2d46;
    }

    .summary-card span {
      color: #8f4f3b;
    }

    .view-toggle button {
      background: rgba(255,250,245,.92);
      border-color: #d4c1b5;
      color: #745f69;
    }

    .view-toggle button[aria-pressed="true"] {
      background: linear-gradient(135deg, #7c4252, #9a563d);
      border-color: #7c4252;
      color: #fff9f4;
      box-shadow: 0 6px 16px rgba(91,47,59,.18);
    }

    .ledger {
      background:
        radial-gradient(circle at 92% 0%, rgba(173,102,62,.15), transparent 30%),
        radial-gradient(circle at 0% 100%, rgba(76,120,101,.11), transparent 34%),
        linear-gradient(145deg, #251725 0%, #1c151d 58%, #181317 100%);
      border-color: #67424f;
      box-shadow:
        0 18px 44px rgba(54,31,43,.22),
        inset 0 1px 0 rgba(255,255,255,.035);
    }

    .group-head {
      border-bottom-color: rgba(205,151,118,.28);
    }

    .group-head h2,
    .group-count,
    .timeline-date,
    .timeline-fact span,
    .checkbook-intro,
    .check-fact span,
    .empty {
      color: #bda3aa;
    }

    .name,
    .timeline-fact strong {
      color: #f5e8df;
    }

    .item,
    .timeline-entry {
      border-bottom-color: rgba(221,183,158,.09);
    }

    .history-status.cashed {
      color: #bfe1cf;
      border-color: rgba(113,167,140,.42);
      background: rgba(67,116,91,.2);
    }

    .history-status.canceled {
      color: #f0b8b8;
      border-color: rgba(196,105,105,.38);
      background: rgba(145,61,61,.18);
    }

    .check-card {
      border-color: rgba(222,184,157,.14);
      background: linear-gradient(135deg, rgba(255,255,255,.055), rgba(255,255,255,.025));
      box-shadow: inset 0 1px 0 rgba(255,255,255,.025);
    }

    .check-card::before {
      background: #5b8a70;
    }

    .check-card.soon::before { background: #c1843f; }
    .check-card.urgent::before,
    .check-card.expired::before { background: #b34e4e; }

    .check-amount {
      color: #fff6ed;
    }

    .check-reason {
      color: #dbc8c6;
    }

    .check-fact strong {
      color: #f2e7e0;
    }

    .check-countdown {
      border-top-color: rgba(222,184,157,.12);
      color: #cbb7b9;
    }

    .check-id {
      color: #8f727d;
    }

    .footnote {
      color: #76646d;
    }

    /* SFL shared button motion standard */
    button,
    a.button{
      transition:
        transform .16s ease,
        filter .16s ease,
        box-shadow .16s ease,
        background-color .16s ease,
        border-color .16s ease,
        color .16s ease;
    }

    @media (hover:hover) and (pointer:fine){
      button:not(:disabled):hover,
      a.button:hover{
        transform:translateY(-1px);
      }
    }

    button:not(:disabled):active,
    a.button:active{
      transform:translateY(0) scale(.985);
    }

    button:disabled{
      transform:none;
    }

    @media (prefers-reduced-motion:reduce){
      button,
      a.button{
        transition:none !important;
      }

      button:not(:disabled):hover,
      a.button:hover,
      button:not(:disabled):active,
      a.button:active{
        transform:none !important;
      }
    }


    /* Historical metric dashboard — separated card layout */
    .crew-total {
      grid-template-rows: auto auto;
      gap: 12px;
      background: transparent;
      border: 0;
      border-radius: 0;
      overflow: visible;
      box-shadow: none;
    }

    .crew-metric {
      grid-row: 1;
      min-height: 138px;
      background: rgba(255,250,245,.94);
      border: 1px solid #d8c8bd;
      border-radius: 14px;
      box-shadow: 0 8px 20px rgba(70,45,52,.055);
    }

    .crew-metric:first-child {
      grid-column: 1;
      background: linear-gradient(135deg, rgba(255,250,245,.98), rgba(249,239,232,.96));
    }

    .holder-metric {
      grid-column: 2;
      position: relative;
      background: linear-gradient(135deg, rgba(255,250,245,.98), rgba(238,244,238,.94));
    }

    .crew-metric + .crew-metric {
      border-left: 1px solid #d8c8bd;
    }

    .holder-metric .metric-title {
      order: 1;
    }

    .holder-metric strong {
      order: 2;
      margin: 3px 0 5px;
    }

    .holder-metric small {
      order: 3;
    }

    .metric-dashboard-row {
      grid-column: 1 / -1;
      grid-row: 2;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      align-items: stretch;
      min-width: 0;
      background: transparent;
    }

    .metric-dashboard-cell {
      min-width: 0;
      min-height: 76px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px 12px 14px;
      text-align: center;
      background: rgba(255,250,245,.92);
      border: 1px solid #d8c8bd;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(70,45,52,.05);
    }

    .metric-dashboard-cell + .metric-dashboard-cell {
      border-left: 1px solid #d8c8bd;
    }

    .metric-chart-link {
      color: #8f4f3b;
      font-size: 12px;
      font-weight: 850;
      letter-spacing: .02em;
      text-decoration: none;
      white-space: nowrap;
      border-bottom: 1px solid rgba(143,79,59,.34);
      padding-bottom: 1px;
    }

    .metric-chart-link:hover,
    .metric-chart-link:focus-visible {
      color: #633342;
      border-bottom-color: currentColor;
      outline: none;
    }

    .reach-metric {
      display: grid;
      gap: 2px;
      place-items: center;
      align-content: center;
    }

    .reach-metric span {
      color: #8f4f3b;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .reach-metric strong {
      color: #4a2d46;
      font-size: 24px;
      line-height: 1;
      text-shadow: 0 1px 0 rgba(255,255,255,.8);
    }

    .reach-metric small {
      color: #76636d;
      font-size: 10px;
      line-height: 1.25;
    }

    @media (max-width: 560px) {
      .crew-total {
        grid-template-columns: 1fr;
      }

      .crew-metric:first-child,
      .holder-metric {
        grid-column: 1;
      }

      .crew-metric:first-child { grid-row: 1; }
      .holder-metric { grid-row: 2; }
      .metric-dashboard-row { grid-row: 3; gap: 8px; }

      .metric-dashboard-cell {
        min-height: 68px;
        padding-inline: 8px;
      }

      .metric-chart-link {
        font-size: 11px;
      }

      .reach-metric strong {
        font-size: 21px;
      }
    }



    /* View Community backend theme — visual shell only */
    :root {
      --ink: #f5fbfa;
      --muted: rgba(236, 249, 247, .72);
      --line: rgba(219, 248, 244, .14);
      --soft: transparent;
      --panel: rgba(10, 45, 58, .70);
      --blue: #79d5c2;
      --green: #29b8b1;
      --amber: #f4bd58;
      --red: #ef765d;
      --dark: rgba(5, 34, 46, .58);
      --dark-line: rgba(219, 248, 244, .14);
      --dark-text: #e7f7f4;
      --dark-muted: rgba(236, 249, 247, .62);
    }

    body {
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 14%, rgba(41, 184, 177, .34) 0, rgba(41, 184, 177, .12) 22%, transparent 44%),
        radial-gradient(circle at 87% 15%, rgba(244, 189, 88, .24) 0, rgba(244, 189, 88, .07) 21%, transparent 42%),
        radial-gradient(circle at 88% 86%, rgba(239, 118, 93, .24) 0, rgba(239, 118, 93, .07) 23%, transparent 46%),
        radial-gradient(circle at 20% 88%, rgba(121, 213, 194, .19) 0, transparent 42%),
        linear-gradient(145deg, #06202e 0%, #0a3444 48%, #071d2a 100%);
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;

  <script>
    (() => {
      "use strict";

      const XRPL_SERVER = "wss://s1.ripple.com/";
      const AUTHORIZED_DISTRIBUTORS = ["rnbmFoUKhnMZ8QCJ6kA5J2uwfP8rm9cUdU"];
      const LEAP_ISSUER = "rh7SidU91xGW2Za5RvoKiCgS2YB2psTBgq";
      const params = new URLSearchParams(window.location.search);
      const requestedRole = (params.get("role") || sessionStorage.getItem("wildLedgerRole") || "owner").trim().toLowerCase();
      const role = requestedRole === "operator" || requestedRole === "manager" ? "operator" : "owner";
      const registry = window.WILD_LEDGER_COMMUNITY_REGISTRY || {};
      const defaultCommunity = Object.values(registry)[0] || null;
      const defaultBackendId = window.WILD_LEDGER_BACKEND_COMMUNITY_ID?.(defaultCommunity) || "";
      const requestedValue = params.get("community") || defaultBackendId;
      const community = window.WILD_LEDGER_GET_COMMUNITY?.(requestedValue) || null;
      const requestedCommunity = window.WILD_LEDGER_BACKEND_COMMUNITY_ID?.(community) || String(requestedValue || "").trim().toUpperCase();
      const communityName = community?.communityName || "Community";
      const viewCommunityTitle = document.getElementById("view-community-title");
      if (viewCommunityTitle) viewCommunityTitle.textContent = communityName;
      const createBadgeLink = document.getElementById("createBadgeLink");
      const createChallengeLink = document.getElementById("createChallengeLink");
      const createEventLink = document.getElementById("createEventLink");
      if (createBadgeLink) {
        createBadgeLink.href = `createBadge.html?community=${encodeURIComponent(requestedCommunity)}&role=${encodeURIComponent(role)}`;
      }
      if (createChallengeLink) {
        createChallengeLink.href = `createChallenge.html?community=${encodeURIComponent(requestedCommunity)}&role=${encodeURIComponent(role)}`;
      }
      if (createEventLink) {
        createEventLink.href = `createEvent.html?community=${encodeURIComponent(requestedCommunity)}&role=${encodeURIComponent(role)}`;
      }
      document.title = `${communityName} | Community Recognition`;
      const NAMESPACE = community?.leapNamespace || `${requestedCommunity}-LEAP`;
      const RECOGNIZED_KEYS = ["BADGE", "EVENT", "CHALLENGE"];
      const RIPPLE_EPOCH_MS = Date.UTC(2000, 0, 1);

      const records = {
        BADGE: new Map(),
        EVENT: new Map(),
        CHALLENGE: new Map()
      };

      let historyEntries = [];
      let checkCreatesById = new Map();
      let checkCreatesByHash = new Map();
      let checkResolutionsById = new Map();
      let historyView = "badges";

      let socket = null;
      let requestCounter = 0;
      let pending = new Map();
      let scannedTransactions = 0;
      let historyLoaded = false;
      const historySummary = document.getElementById("historySummary");
      const badgesView = document.getElementById("badgesView");
      const challengesView = document.getElementById("challengesView");
      const eventsView = document.getElementById("eventsView");
      const badgesViewButton = document.getElementById("badgesViewButton");
      const challengesViewButton = document.getElementById("challengesViewButton");
      const eventsViewButton = document.getElementById("eventsViewButton");

      const recognitionMode = { badges: "available", challenges: "active", events: "active" };
      const subviews = {
        badges: {
          available: document.getElementById("badgesAvailablePanel"),
          history: document.getElementById("badgesHistoryPanel"),
          availableButton: document.getElementById("badgesAvailableButton"),
          historyButton: document.getElementById("badgesHistoryButton")
        },
        challenges: {
          active: document.getElementById("challengesActivePanel"),
          history: document.getElementById("challengesHistoryPanel"),
          activeButton: document.getElementById("challengesActiveButton"),
          historyButton: document.getElementById("challengesHistoryButton")
        },
        events: {
          active: document.getElementById("eventsActivePanel"),
          history: document.getElementById("eventsHistoryPanel"),
          activeButton: document.getElementById("eventsActiveButton"),
          historyButton: document.getElementById("eventsHistoryButton")
        }
      };

      function rippleTimeToIso(seconds) {
        if (typeof seconds !== "number") return null;
        return new Date(RIPPLE_EPOCH_MS + seconds * 1000).toISOString();
      }

      function cleanIso(value) {
        if (value === null || value === undefined || value === "") return null;
        if (typeof value === "number") return rippleTimeToIso(value);
        const date = new Date(value);
        return Number.isNaN(date.getTime()) ? null : date.toISOString();
      }

      function hexToText(value) {
        if (!value || typeof value !== "string") return "";
        if (!/^[A-Fa-f0-9]+$/.test(value) || value.length % 2 !== 0) return value;
        try {
          const bytes = new Uint8Array(value.match(/.{2}/g).map(pair => parseInt(pair, 16)));
          return new TextDecoder("utf-8", { fatal: false }).decode(bytes).replace(/\0+$/g, "");
        } catch {
          return value;
        }
      }

      function decodeCurrency(value) {
        const code = String(value || "");
        if (!/^[A-Fa-f0-9]{40}$/.test(code)) return code;
        try {
          let out = "";
          for (let i = 0; i < code.length; i += 2) {
            const n = parseInt(code.slice(i, i + 2), 16);
            if (n === 0) break;
            out += String.fromCharCode(n);
          }
          return out;
        } catch {
          return code;
        }
      }

      function isLeapAmount(amount) {
        return !!amount && typeof amount === "object" &&
          amount.issuer === LEAP_ISSUER && decodeCurrency(amount.currency).toUpperCase() === "LEAP";
      }

      function normalizeTx(entry) {
        return entry?.tx_json || entry?.tx || entry?.transaction || entry || {};
      }

      function transactionSucceeded(meta) {
        if (!meta || typeof meta !== "object") return true;
        const result = meta.TransactionResult ?? meta.transaction_result;
        return !result || result === "tesSUCCESS";
      }

      function parseStructuredData(text) {
        const out = {};
        if (!text) return out;
        for (const piece of text.split("|")) {
          const equals = piece.indexOf("=");
          if (equals <= 0) continue;
          const key = piece.slice(0, equals).trim().toUpperCase();
          const value = piece.slice(equals + 1).trim();
          if (RECOGNIZED_KEYS.includes(key) && value) out[key] = value;
        }
        return out;
      }

      function parseCanonicalLeapMemo(text) {
        const value = String(text || "").trim();
        if (!value) return null;
        const prefix = NAMESPACE + "/";
        if (!value.toUpperCase().startsWith(prefix)) return null;
        const payload = value.slice(prefix.length);
        const equals = payload.indexOf("=");
        if (equals <= 0) return null;
        const key = payload.slice(0, equals).trim().toUpperCase();
        const factValue = payload.slice(equals + 1).trim();
        if (!RECOGNIZED_KEYS.includes(key)) return null;
        if (!/^[A-Za-z0-9][A-Za-z0-9-]*$/.test(factValue)) return null;
        return { key, value: factValue };
      }

      function extractFacts(tx) {
        const facts = [];
        const seen = new Set();
        const memos = Array.isArray(tx.Memos) ? tx.Memos : [];

        function addFact(fact) {
          if (!fact) return;
          const signature = `${fact.key}=${fact.value}`;
          if (seen.has(signature)) return;
          seen.add(signature);
          facts.push(fact);
        }

        for (const wrapper of memos) {
          const memo = wrapper?.Memo || {};
          const type = hexToText(memo.MemoType).trim();
          const format = hexToText(memo.MemoFormat).trim();
          const data = hexToText(memo.MemoData).trim();

          addFact(parseCanonicalLeapMemo(data));
          addFact(parseCanonicalLeapMemo(type));
          addFact(parseCanonicalLeapMemo(format));

          if (type.toUpperCase() === NAMESPACE) {
            const parsed = parseStructuredData(data);
            for (const key of RECOGNIZED_KEYS) {
              if (parsed[key]) addFact({ key, value: parsed[key] });
            }
          }

          const legacyPrefix = NAMESPACE + "/";
          if (type.toUpperCase().startsWith(legacyPrefix) && !type.includes("=")) {
            const legacyKey = type.slice(legacyPrefix.length).trim().toUpperCase();
            if (RECOGNIZED_KEYS.includes(legacyKey) && data) {
              addFact({ key: legacyKey, value: data });
            } else if (legacyKey === "NEW-MEMBER") {
              // Historical onboarding form. Treat it as the NEW-MEMBER badge
              // when reading old ledger records; new Checks use the one-line
              // SFL-LEAP/BADGE=NEW-MEMBER syntax.
              addFact({ key: "BADGE", value: "NEW-MEMBER" });
            }
          }
        }

        return facts;
      }

      function extractCreatedCheckId(meta) {
        const nodes = meta?.AffectedNodes || meta?.affected_nodes || [];
        for (const wrapper of nodes) {
          const node = wrapper?.CreatedNode || wrapper?.created_node;
          if (!node) continue;
          const type = node.LedgerEntryType || node.ledger_entry_type;
          if (type !== "Check") continue;
          return node.LedgerIndex || node.ledger_index || null;
        }
        return null;
      }

      function rememberCheckCreate(tx, meta, info) {
        if (tx.TransactionType !== "CheckCreate") return null;
        if (!AUTHORIZED_DISTRIBUTORS.includes(tx.Account)) return null;

        const checkId = extractCreatedCheckId(meta);
        const record = {
          hash: info.hash || tx.hash || "",
          checkId: checkId || "",
          time: cleanIso(info.time),
          ledger: info.ledger ?? null,
          destination: tx.Destination || "",
          amount: tx.SendMax,
          expiration: typeof tx.Expiration === "number" ? tx.Expiration : null,
          facts: extractFacts(tx)
        };

        if (record.hash) checkCreatesByHash.set(record.hash, record);
        if (checkId) checkCreatesById.set(checkId, record);
        return record;
      }

      function rememberCheckResolution(tx, info) {
        if (!["CheckCash", "CheckCancel"].includes(tx.TransactionType)) return false;

        const checkId = tx.CheckID || tx.check_id || "";
        if (!checkId) return false;

        // Only attach lifecycle state to a Check we already proved was created
        // by an authorized LEAP distributor.
        if (!checkCreatesById.has(checkId)) return false;

        const next = {
          status: tx.TransactionType === "CheckCancel" ? "canceled" : "cashed",
          time: cleanIso(info.time),
          ledger: info.ledger ?? null,
          hash: info.hash || tx.hash || ""
        };

        const existing = checkResolutionsById.get(checkId);
        if (existing &&
            existing.status === next.status &&
            existing.hash === next.hash) return false;

        checkResolutionsById.set(checkId, next);
        return true;
      }

      function resolutionForEntry(entry) {
        if (!entry?.checkId) return null;
        return checkResolutionsById.get(entry.checkId) || null;
      }

      function isCanceledEntry(entry) {
        return resolutionForEntry(entry)?.status === "canceled";
      }

      function isNewMemberCheck(create) {
        return !!create?.facts?.some(fact =>
          fact.key === "BADGE" &&
          String(fact.value || "").trim().toUpperCase() === "NEW-MEMBER"
        );
      }

      function totalCrewMembers() {
        let total = 0;

        for (const [checkId, create] of checkCreatesById.entries()) {
          if (!isNewMemberCheck(create)) continue;
          if (checkResolutionsById.get(checkId)?.status === "cashed") total += 1;
        }

        return total;
      }

      function historyStatusNode(entry) {
        const resolution = resolutionForEntry(entry);
        if (!resolution) return null;

        const badge = document.createElement("span");
        badge.className = `history-status ${resolution.status}`;
        badge.textContent = resolution.status === "canceled" ? "Canceled" : "Cashed";
        badge.title = resolution.time
          ? `${badge.textContent} ${prettyDateTime(resolution.time)}`
          : badge.textContent;
        return badge;
      }

      function recordFact(key, value, info) {
        const map = records[key];
        if (!map || !value) return;
        const normalizedValue = value.trim();
        if (!normalizedValue) return;
        const existing = map.get(normalizedValue);
        const when = cleanIso(info.time);

        if (!existing) {
          map.set(normalizedValue, { value: normalizedValue, count: 1, firstSeen: when, lastSeen: when });
          return;
        }

        existing.count += 1;
        if (when && (!existing.firstSeen || when < existing.firstSeen)) existing.firstSeen = when;
        if (when && (!existing.lastSeen || when > existing.lastSeen)) existing.lastSeen = when;
      }

      function recordHistoryEntry(facts, info) {
        if (!facts.length) return;
        const hash = info.hash || "";
        if (hash && historyEntries.some(entry => entry.hash === hash)) return;
        historyEntries.push({
          hash,
          checkId: info.checkId || "",
          transactionType: info.transactionType || "",
          time: cleanIso(info.time),
          ledger: info.ledger ?? null,
          facts: facts.map(fact => ({ key: fact.key, value: fact.value }))
        });
      }

      function processHistoryEntry(entry) {
        if (entry?.validated === false) return;
        const tx = normalizeTx(entry);
        const meta = entry?.meta || tx?.meta;
        if (!transactionSucceeded(meta)) return;

        const info = {
          time: entry?.close_time_iso || entry?.date || tx?.date || null,
          ledger: entry?.ledger_index || tx?.ledger_index || tx?.inLedger || null,
          hash: entry?.hash || tx?.hash || null,
          transactionType: tx.TransactionType || ""
        };

        const create = rememberCheckCreate(tx, meta, info);
        rememberCheckResolution(tx, info);

        // Recognition memos originate with the authorized distributor.
        // CheckCash can be submitted by the recipient, so lifecycle tracking
        // happens above before this authority filter.
        if (!AUTHORIZED_DISTRIBUTORS.includes(tx.Account)) return;

        const facts = extractFacts(tx);
        if (!facts.length) return;

        info.checkId = create?.checkId || "";
        recordHistoryEntry(facts, info);
        for (const fact of facts) recordFact(fact.key, fact.value, info);
      }

      function processLiveMessage(message) {
        const tx = message?.transaction || message?.tx_json || {};
        if (message?.validated === false) return;

        const meta = message?.meta;
        if (!transactionSucceeded(meta)) return;

        const info = {
          time: message?.close_time_iso || rippleTimeToIso(tx.date) || new Date().toISOString(),
          ledger: message?.ledger_index || tx?.ledger_index || null,
          hash: tx?.hash || message?.hash || null,
          transactionType: tx.TransactionType || ""
        };

        const create = rememberCheckCreate(tx, meta, info);
        const resolutionChanged = rememberCheckResolution(tx, info);

        if (!AUTHORIZED_DISTRIBUTORS.includes(tx.Account)) {
          if (resolutionChanged) render();
          return;
        }

        const facts = extractFacts(tx);
        if (!facts.length) {
          if (resolutionChanged) render();
          return;
        }

        info.checkId = create?.checkId || "";
        recordHistoryEntry(facts, info);
        for (const fact of facts) recordFact(fact.key, fact.value, info);
        render();
      }

      function prettyDate(iso) {
        if (!iso) return "date unavailable";
        return new Intl.DateTimeFormat(undefined, {
          year: "numeric", month: "short", day: "numeric"
        }).format(new Date(iso));
      }

      function prettyDateTime(iso) {
        if (!iso) return "No expiration set";
        return new Intl.DateTimeFormat(undefined, {
          year: "numeric", month: "short", day: "numeric",
          hour: "numeric", minute: "2-digit"
        }).format(new Date(iso));
      }

      function sortNewestFirst(a, b) {
        const ta = a.time ? new Date(a.time).getTime() : 0;
        const tb = b.time ? new Date(b.time).getTime() : 0;
        return tb - ta;
      }

      function renderCategoryGroup(key) {
        const target = document.getElementById(key);
        target.replaceChildren();

        // BADGES and CHALLENGES are registries, not award/completion history.
        // Show each identifier once, alphabetically, regardless of how many times it
        // has been used or whether a particular Check carrying it was later canceled.
        if (key === "BADGE" || key === "CHALLENGE") {
          const identifiers = new Set();

          for (const entry of historyEntries) {
            for (const fact of entry.facts) {
              if (fact.key === key && fact.value) identifiers.add(fact.value.trim());
            }
          }

          const sortedIdentifiers = [...identifiers].sort((a, b) => {
            if (key === "CHALLENGE") {
              const aMatch = a.match(/(\d+)$/);
              const bMatch = b.match(/(\d+)$/);
              if (aMatch && bMatch) {
                const delta = Number(aMatch[1]) - Number(bMatch[1]);
                if (delta !== 0) return delta;
              }
            }
            return a.localeCompare(b, undefined, { sensitivity: "base", numeric: true });
          });

          if (!sortedIdentifiers.length) {
            const empty = document.createElement("div");
            empty.className = "empty";
            empty.textContent = "None found on the ledger yet.";
            target.appendChild(empty);
            return;
          }

          for (const identifier of sortedIdentifiers) {
            const row = document.createElement("div");
            row.className = "item";

            const name = document.createElement("div");
            name.className = "name";
            name.textContent = identifier;

            row.appendChild(name);
            target.appendChild(row);
          }
          return;
        }

        // EVENTS are occurrences, so keep their ledger dates and lifecycle status.
        const occurrences = [];

        for (const entry of historyEntries) {
          const matchingFacts = entry.facts.filter(fact => fact.key === key);
          if (!matchingFacts.length) continue;
          occurrences.push({ time: entry.time, facts: matchingFacts, entry });
        }

        occurrences.sort(sortNewestFirst);

        if (!occurrences.length) {
          const empty = document.createElement("div");
          empty.className = "empty";
          empty.textContent = "None found on the ledger yet.";
          target.appendChild(empty);
          return;
        }

        for (const occurrence of occurrences) {
          const resolution = resolutionForEntry(occurrence.entry);

          for (const fact of occurrence.facts) {
            const row = document.createElement("div");
            row.className = "item" + (resolution?.status === "canceled" ? " canceled" : "");

            const name = document.createElement("div");
            name.className = "name";
            name.textContent = fact.value;

            const meta = document.createElement("div");
            meta.className = "meta";

            const date = document.createElement("div");
            date.textContent = prettyDate(occurrence.time);
            meta.appendChild(date);

            const status = historyStatusNode(occurrence.entry);
            if (status) meta.appendChild(status);

            row.append(name, meta);
            target.appendChild(row);
          }
        }
      }

      function renderRecognitionHistory(key, targetId) {
        const target = document.getElementById(targetId);
        if (!target) return;
        target.replaceChildren();

        const occurrences = [];
        for (const entry of historyEntries) {
          const matchingFacts = entry.facts.filter(fact => fact.key === key);
          if (!matchingFacts.length) continue;
          occurrences.push({ time: entry.time, facts: matchingFacts, entry });
        }
        occurrences.sort(sortNewestFirst);

        if (!occurrences.length) {
          const empty = document.createElement("div");
          empty.className = "empty";
          empty.textContent = "No history found on the ledger yet.";
          target.appendChild(empty);
          return;
        }

        for (const occurrence of occurrences) {
          const resolution = resolutionForEntry(occurrence.entry);
          for (const fact of occurrence.facts) {
            const row = document.createElement("div");
            row.className = "item" + (resolution?.status === "canceled" ? " canceled" : "");

            const name = document.createElement("div");
            name.className = "name";
            name.textContent = fact.value;

            const meta = document.createElement("div");
            meta.className = "meta";

            const date = document.createElement("div");
            date.textContent = prettyDate(occurrence.time);
            meta.appendChild(date);

            const status = historyStatusNode(occurrence.entry);
            if (status) meta.appendChild(status);

            row.append(name, meta);
            target.appendChild(row);
          }
        }
      }

      function renderActiveEvents() {
        const target = document.getElementById("EVENT_ACTIVE");
        if (!target) return;
        target.replaceChildren();
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "No active events are listed right now.";
        target.appendChild(empty);
      }

      function setRecognitionMode(category, mode) {
        const config = subviews[category];
        if (!config || !config[mode]) return;
        recognitionMode[category] = mode;

        for (const candidate of ["available", "active", "history"]) {
          if (config[candidate]) config[candidate].hidden = candidate !== mode;
          const button = config[`${candidate}Button`];
          if (button) button.setAttribute("aria-pressed", String(candidate === mode));
        }
      }

      function setHistoryView(view) {
        historyView = ["badges", "challenges", "events"].includes(view) ? view : "badges";

        badgesView.hidden = historyView !== "badges";
        challengesView.hidden = historyView !== "challenges";
        eventsView.hidden = historyView !== "events";

        badgesViewButton.setAttribute("aria-pressed", String(historyView === "badges"));
        challengesViewButton.setAttribute("aria-pressed", String(historyView === "challenges"));
        eventsViewButton.setAttribute("aria-pressed", String(historyView === "events"));
        setRecognitionMode(historyView, recognitionMode[historyView]);
      }

      function render() {
        renderCategoryGroup("BADGE");
        renderCategoryGroup("CHALLENGE");
        renderCategoryGroup("EVENT");
        renderRecognitionHistory("BADGE", "BADGE_HISTORY");
        renderRecognitionHistory("CHALLENGE", "CHALLENGE_HISTORY");
        renderActiveEvents();

        const counts = {};

        // Badges and challenges are registry counts: unique identifiers ever defined.
        // Canceling one Check does not erase the identifier from either registry.
        for (const key of ["BADGE", "CHALLENGE"]) {
          const values = new Set();
          for (const entry of historyEntries) {
            for (const fact of entry.facts) {
              if (fact.key === key && fact.value) values.add(fact.value.trim());
            }
          }
          counts[key] = values.size;
        }

        // Events are dated occurrences. Canceled event Checks remain visible as history
        // but do not count as active event occurrences.
        {
          const activeValues = new Set();
          let active = 0;
          let canceled = 0;

          for (const entry of historyEntries) {
            const matching = entry.facts.filter(fact => fact.key === "EVENT");
            if (!matching.length) continue;

            if (isCanceledEntry(entry)) {
              canceled += matching.length;
              continue;
            }

            active += matching.length;
            for (const fact of matching) activeValues.add(fact.value);
          }

          counts.EVENT = activeValues.size;
        }

        document.getElementById("badgeTotal").textContent = counts.BADGE;
        document.getElementById("eventTotal").textContent = counts.EVENT;
        document.getElementById("challengeTotal").textContent = counts.CHALLENGE;

        setHistoryView(historyView);
      }

      function resetRecords() {
        for (const key of RECOGNIZED_KEYS) records[key].clear();
        historyEntries = [];
        checkCreatesById = new Map();
        checkCreatesByHash = new Map();
        checkResolutionsById = new Map();
        scannedTransactions = 0;
        historyLoaded = false;
        render();
      }

      function connect() {
        return new Promise((resolve, reject) => {
          socket = new WebSocket(XRPL_SERVER);

          const timeout = setTimeout(() => {
            reject(new Error("Timed out connecting to XRPL."));
            try { socket.close(); } catch {}
          }, 15000);

          socket.addEventListener("open", () => {
            clearTimeout(timeout);
            resolve();
          }, { once: true });

          socket.addEventListener("error", () => {
            clearTimeout(timeout);
            reject(new Error("XRPL connection failed."));
          }, { once: true });

          socket.addEventListener("message", event => {
            let message;
            try { message = JSON.parse(event.data); } catch { return; }

            if (message.id && pending.has(message.id)) {
              const handlers = pending.get(message.id);
              pending.delete(message.id);
              if (message.status === "error" || message.error || message.result?.error) {
                handlers.reject(new Error(
                  message.error_message || message.result?.error_message || message.error || message.result?.error || "XRPL request failed."
                ));
              } else {
                handlers.resolve(message.result || message);
              }
              return;
            }

            if (message.type === "transaction") processLiveMessage(message);
          });

          socket.addEventListener("close", () => {
          });
        });
      }

      function request(command) {
        return new Promise((resolve, reject) => {
          if (!socket || socket.readyState !== WebSocket.OPEN) {
            reject(new Error("XRPL connection is not open."));
            return;
          }

          const id = "leap-" + (++requestCounter);
          pending.set(id, { resolve, reject });
          socket.send(JSON.stringify({ id, api_version: 2, ...command }));

          setTimeout(() => {
            if (pending.has(id)) {
              pending.delete(id);
              reject(new Error("XRPL request timed out."));
            }
          }, 30000);
        });
      }

      async function loadAccountHistory(account) {
        let marker;
        do {
          const command = {
            command: "account_tx",
            account,
            ledger_index_min: -1,
            ledger_index_max: -1,
            binary: false,
            forward: true,
            limit: 400
          };
          if (marker !== undefined) command.marker = marker;

          const result = await request(command);
          const txs = Array.isArray(result.transactions) ? result.transactions : [];
          for (const entry of txs) processHistoryEntry(entry);
          scannedTransactions += txs.length;
          marker = result.marker;
          render();
        } while (marker !== undefined && marker !== null);
      }


      async function start() {
        try {
          if (socket) {
            try { socket.close(); } catch {}
          }
          pending.clear();
          resetRecords();
          await connect();

          for (const account of AUTHORIZED_DISTRIBUTORS) await loadAccountHistory(account);
          historyLoaded = true;
          await subscribeLive();
          render();

        } catch (error) {
          console.warn(error?.message || String(error));
        }
      }

      badgesViewButton.addEventListener("click", () => setHistoryView("badges"));
      challengesViewButton.addEventListener("click", () => setHistoryView("challenges"));
      eventsViewButton.addEventListener("click", () => setHistoryView("events"));

      subviews.badges.availableButton.addEventListener("click", () => setRecognitionMode("badges", "available"));
      subviews.badges.historyButton.addEventListener("click", () => setRecognitionMode("badges", "history"));
      subviews.challenges.activeButton.addEventListener("click", () => setRecognitionMode("challenges", "active"));
      subviews.challenges.historyButton.addEventListener("click", () => setRecognitionMode("challenges", "history"));
      subviews.events.activeButton.addEventListener("click", () => setRecognitionMode("events", "active"));
      subviews.events.historyButton.addEventListener("click", () => setRecognitionMode("events", "history"));

      render();
      if (document.readyState === "complete") {
        start();
      } else {
        window.addEventListener("load", start, { once: true });
      }
    })();
  </script>

  <script>
    (() => {
      const params = new URLSearchParams(window.location.search);
      const community = params.get("community") || sessionStorage.getItem("wildLedgerCommunity") || "SFL";
      const requestedRole = (params.get("role") || sessionStorage.getItem("wildLedgerRole") || "owner").trim().toLowerCase();
      const role = requestedRole === "operator" || requestedRole === "manager" ? "operator" : "owner";
      const viewCommunityBack = document.getElementById("viewCommunityBack");
      if (viewCommunityBack) {
        viewCommunityBack.href = `viewCommunity.html?community=${encodeURIComponent(community)}&role=${encodeURIComponent(role)}`;
      }
    })();
  </script>

</body>
